[package]
name = "le-turbo"
version = "0.2.0"
edition = "2021"
description = "Key and mouse presser for Last Epoch"

[lib]
name = "le_turbo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
] }
